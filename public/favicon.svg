<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Subtle ground shadow -->
  <ellipse cx="256" cy="445" rx="145" ry="32" fill="#0f172a" fill-opacity="0.35" />

  <!-- Beacon Pulse (Top) -->
  <circle cx="256" cy="92" r="44" fill="#1b1236" />
  <circle cx="256" cy="92" r="32" fill="#3b0764" />
  <circle cx="256" cy="92" r="22" fill="#7e22ce" />
  <circle cx="256" cy="92" r="14" fill="#c084fc" />
  <circle cx="256" cy="92" r="7" fill="#ffffff" />

  <!-- Bottom Slab (Largest) -->
  <g id="bottom-slab">
    <!-- Left face -->
    <path d="M 130 366 L 256 438 L 256 480 L 130 408 Z" fill="#6b21a8" />
    <!-- Right face -->
    <path d="M 256 438 L 382 366 L 382 408 L 256 480 Z" fill="#581c87" />
